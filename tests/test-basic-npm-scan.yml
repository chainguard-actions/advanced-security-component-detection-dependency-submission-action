name: Test basic npm project scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
      - name: Assert component-detection was downloaded and the action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary was not downloaded"
            exit 1
          fi
          if [ ! -x "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary is not executable"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan ran; submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert scan output manifest was cleaned up
        run: |
          if [ -f "${RUNNER_TEMP}/component-detection-output.json" ]; then
            echo "FAIL: scan output manifest left behind in RUNNER_TEMP"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/tests/fixtures/npm-project/output.json" ]; then
            echo "FAIL: output.json written into the scanned project"
            exit 1
          fi
          echo "PASS"
