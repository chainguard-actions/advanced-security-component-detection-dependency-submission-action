name: Test fail-on-empty with no dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/empty-project
          fail-on-empty: "true"
      - name: Assert the action failed because no dependencies were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary was not downloaded (failure was not due to fail-on-empty)"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when fail-on-empty is true and no dependencies exist"
            exit 1
          fi
          echo "PASS"
