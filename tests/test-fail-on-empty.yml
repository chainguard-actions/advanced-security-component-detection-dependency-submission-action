name: Test fail-on-empty with a directory containing no dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty scan directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/empty-scan-dir"
          echo "no dependencies here" > "$GITHUB_WORKSPACE/empty-scan-dir/README.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: empty-scan-dir
          fail-on-empty: 'true'
      - name: Assert action failed because no dependencies were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -x "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary was not downloaded (scan never ran)"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when fail-on-empty is true and no dependencies exist"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/component-detection" "$GITHUB_WORKSPACE/empty-scan-dir"
