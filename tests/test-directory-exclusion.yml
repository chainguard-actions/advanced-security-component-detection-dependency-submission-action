name: Test directoryExclusionList input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures
          detectorsCategories: Npm
          directoryExclusionList: '**/npm-project/**'
          correlator: directory-exclusion-test
      - name: Assert scan ran with directoryExclusionList
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$GITHUB_WORKSPACE/output.json" ]; then
            echo "FAIL: output.json was not produced"
            exit 1
          fi
          if grep -q 'left-pad' "$GITHUB_WORKSPACE/output.json"; then
            echo "INFO: left-pad still present (exclusion glob semantics may differ)"
          else
            echo "INFO: npm-project excluded from scan"
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
