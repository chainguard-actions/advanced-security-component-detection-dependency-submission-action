name: Test full detector configuration with snapshot overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - name: Get HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
          detectorsCategories: Npm
          detector-name: custom-detector
          detector-version: 1.2.3
          detector-url: https://example.com/custom-detector
          snapshot-sha: ${{ steps.sha.outputs.sha }}
          snapshot-ref: refs/heads/main
      - name: Assert scan ran and validation passed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$GITHUB_WORKSPACE/output.json" ]; then
            echo "FAIL: output.json was not produced"
            exit 1
          fi
          if ! grep -q 'left-pad' "$GITHUB_WORKSPACE/output.json"; then
            echo "FAIL: left-pad not found in scan results"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
