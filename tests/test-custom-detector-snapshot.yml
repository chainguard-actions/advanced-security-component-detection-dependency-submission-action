name: Test custom detector and snapshot overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
          detectorsCategories: Npm
          correlator: custom-correlator
          detector-name: my-detector
          detector-version: 1.2.3
          detector-url: https://example.com/my-detector
          snapshot-sha: 0123456789abcdef0123456789abcdef01234567
          snapshot-ref: refs/heads/main
      - name: Assert outcome (submission to sentinel repo may fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert scan ran and detected left-pad
        run: |
          f="$GITHUB_WORKSPACE/output.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: output.json not produced"
            exit 1
          fi
          if ! grep -q 'left-pad' "$f"; then
            head -c 3000 "$f"; echo
            echo "FAIL: left-pad not detected"
            exit 1
          fi
          echo "PASS"
