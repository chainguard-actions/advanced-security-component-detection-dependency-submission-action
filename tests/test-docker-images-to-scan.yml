name: Test dockerImagesToScan input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
          detectorsCategories: Npm
          dockerImagesToScan: alpine:3.19
      - name: Assert outcome (docker scan / sentinel submission may fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert component-detection binary was downloaded
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary missing or empty"
            exit 1
          fi
          echo "PASS"
