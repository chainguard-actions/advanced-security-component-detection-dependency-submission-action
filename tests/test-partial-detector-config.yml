name: Test partial detector configuration fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
          detectorsCategories: Npm
          detector-name: only-a-name
      - name: Assert action failed due to incomplete detector config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when only detector-name is provided"
            exit 1
          fi
          echo "PASS"
