name: Test partial detector configuration is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
          detector-name: my-detector
      - name: Assert action failed on incomplete detector configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when only detector-name is provided"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/component-detection"
