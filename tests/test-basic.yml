name: Test basic scan of npm fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          filePath: tests/fixtures/npm-project
      - name: Assert action ran (submission may fail on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -x "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary was not downloaded"
            exit 1
          fi
          echo "component-detection binary present"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan ran; submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert scan manifest was cleaned up
        run: |
          if [ -f "${RUNNER_TEMP}/component-detection-output.json" ]; then
            echo "FAIL: scan manifest left behind in RUNNER_TEMP"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/component-detection"
