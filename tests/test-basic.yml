name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous artifacts
        run: rm -f "$GITHUB_WORKSPACE/output.json" "$GITHUB_WORKSPACE/component-detection"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert scan ran and submission succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -x "$GITHUB_WORKSPACE/component-detection" ]; then
            echo "FAIL: component-detection binary was not downloaded"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/output.json" ]; then
            echo "FAIL: output.json was not produced by the scan"
            exit 1
          fi
          if ! grep -q '"componentsFound"' "$GITHUB_WORKSPACE/output.json"; then
            echo "FAIL: output.json lacks componentsFound"
            head -c 2000 "$GITHUB_WORKSPACE/output.json"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan completed; submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
